name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax check every asset
        run: for f in consent-manager.js consent-ui.js integrations/*.js; do node --check "$f" || exit 1; done
      - name: Boot regression tests
        run: node --test test/boot.test.mjs
